<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Enhanced Ludo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:#f0f0f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px 8px;user-select:none;-webkit-tap-highlight-color:transparent;}

/* ── COVER PAGE ── */
#cover-screen{
  display:flex;position:fixed;inset:0;z-index:300;
  flex-direction:column;align-items:center;justify-content:center;
  background:#ffffff;overflow:hidden;
}
#cover-screen.hide{
  animation:coverOut 0.7s cubic-bezier(0.4,0,0.2,1) forwards;
}
@keyframes coverOut{
  0%{opacity:1;transform:scale(1);}
  100%{opacity:0;transform:scale(1.08);pointer-events:none;}
}
/* Quadrant background */
#cover-bg{
  position:absolute;inset:0;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
}
.cover-quad{opacity:0;animation:quadIn 0.5s ease forwards;}
.cover-quad:nth-child(1){background:#e8222a;animation-delay:0.05s;}
.cover-quad:nth-child(2){background:#3a6fd8;animation-delay:0.15s;}
.cover-quad:nth-child(3){background:#3aaa35;animation-delay:0.25s;}
.cover-quad:nth-child(4){background:#f5a623;animation-delay:0.35s;}
@keyframes quadIn{0%{opacity:0;transform:scale(0.85);}100%{opacity:1;transform:scale(1);}}

/* Center white diamond */
#cover-diamond{
  position:absolute;
  width:62%;padding-top:62%;
  background:#fff;
  transform:rotate(45deg);
  border-radius:12px;
  opacity:0;
  animation:diamondIn 0.5s ease 0.4s forwards;
}
@keyframes diamondIn{0%{opacity:0;transform:rotate(45deg) scale(0.5);}100%{opacity:1;transform:rotate(45deg) scale(1);}}

/* Title */
#cover-title{
  position:relative;z-index:2;
  text-align:center;
  opacity:0;
  animation:titleIn 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.65s forwards;
}
@keyframes titleIn{
  0%{opacity:0;transform:translateY(30px) scale(0.8);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}
#cover-title .ludo-word{
  font-size:clamp(44px,12vw,72px);
  font-weight:900;
  letter-spacing:-1px;
  line-height:1;
  display:block;
}
#cover-title .ludo-word span{
  display:inline-block;
  animation:letterBounce 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
}
#cover-title .new-word{
  font-size:clamp(18px,5vw,28px);
  font-weight:700;
  letter-spacing:6px;
  color:#ffffff;
  opacity:0;
  animation:fadeUp 0.5s ease 1.1s forwards;
}
@keyframes letterBounce{0%{opacity:0;transform:translateY(-40px);}100%{opacity:1;transform:translateY(0);}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(8px);}100%{opacity:1;transform:translateY(0);}}

/* Floating pieces on cover */
.cover-piece{
  position:absolute;
  opacity:0;
  animation:pieceFloat 3s ease-in-out infinite, pieceIn 0.5s ease forwards;
}
@keyframes pieceIn{0%{opacity:0;transform:scale(0);}100%{opacity:1;transform:scale(1);}}
@keyframes pieceFloat{
  0%,100%{transform:translateY(0px) rotate(0deg);}
  33%{transform:translateY(-12px) rotate(3deg);}
  66%{transform:translateY(-6px) rotate(-2deg);}
}

/* Tap to play */
#cover-tap{
  position:relative;z-index:2;
  margin-top:28px;
  font-size:15px;font-weight:700;
  color:#ffffff;letter-spacing:2px;
  opacity:0;
  animation:tapPulse 1.2s ease 1.5s infinite;
}
@keyframes tapPulse{0%,100%{opacity:0.5;}50%{opacity:1;}}

/* ── START SCREEN ── */
#start-screen{width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;gap:18px;padding:10px 0;}
#start-screen h1{font-size:28px;font-weight:900;color:#222;letter-spacing:-0.5px;}
#start-screen h1 span{color:#e8222a;}
.start-card{background:#fff;border-radius:16px;border:1.5px solid #e0e0e0;padding:18px 20px;width:100%;}
.start-card h3{font-size:13px;font-weight:700;color:#aaa;letter-spacing:1.5px;margin-bottom:12px;}
.player-btns{display:flex;gap:8px;}
.player-btn{flex:1;padding:12px 0;border-radius:10px;border:2px solid #e0e0e0;background:#fff;font-family:'Nunito',sans-serif;font-size:16px;font-weight:700;color:#999;cursor:pointer;transition:all 0.15s;}
.player-btn.active{border-color:#333;background:#333;color:#fff;}
.color-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.color-dot{width:22px;height:22px;border-radius:50%;flex-shrink:0;}
.color-row input{flex:1;height:36px;border-radius:8px;border:1.5px solid #e0e0e0;padding:0 10px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:600;outline:none;}
.color-row input:focus{border-color:#333;}
.dice-opts{display:flex;gap:10px;}
.dice-opt{flex:1;border:2px solid #e0e0e0;border-radius:10px;padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all 0.15s;}
.dice-opt.active{border-color:#333;}
.dice-opt span{font-size:11px;font-weight:700;color:#888;}
.dice-preview{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.dice-preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;width:30px;height:30px;}
.pip-dot{width:7px;height:7px;border-radius:50%;}
#start-btn{width:100%;padding:16px;background:#222;color:#fff;border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-size:17px;font-weight:800;cursor:pointer;transition:transform 0.1s;}
#start-btn:active{transform:scale(0.97);}

/* ── GAME SCREEN ── */
#game-screen{display:none;width:100%;max-width:520px;flex-direction:column;align-items:center;}
#topbar{width:100%;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px;}
#turn-indicator{display:flex;align-items:center;gap:8px;background:#fff;border-radius:20px;padding:6px 14px;border:1.5px solid #e0e0e0;font-size:13px;font-weight:700;}
#turn-dot{width:20px;height:20px;border-radius:50%;}
#menu-btn{width:36px;height:36px;border-radius:50%;background:#fff;border:1.5px solid #e0e0e0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:#555;position:relative;}
#menu-dropdown{display:none;position:absolute;top:42px;right:0;background:#fff;border:1.5px solid #e0e0e0;border-radius:10px;padding:6px 0;min-width:140px;z-index:100;box-shadow:0 4px 20px #0001;}
#menu-dropdown.open{display:block;}
.menu-item{padding:9px 16px;font-size:13px;color:#333;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:600;}
.menu-item:hover{background:#f5f5f5;}
#board-wrap{width:100%;border-radius:14px;border:2.5px solid #ccc;overflow:hidden;box-shadow:0 4px 24px #0000001a;}
#board-canvas{display:block;width:100%;height:auto;}
#bottomui{width:100%;display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:8px;}
#dice{width:60px;height:60px;background:#fff;border:2.5px solid #1a1a1a;border-radius:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.08s;}
#dice:active{transform:scale(0.93);}
#dice-label{font-size:9px;color:#aaa;letter-spacing:1.5px;font-weight:700;}
#gamelog{background:#fff;border:1.5px solid #e0e0e0;border-radius:10px;padding:7px 18px;font-size:12px;color:#555;font-weight:700;text-align:center;width:100%;max-width:340px;min-height:32px;}

/* ── ANIMATIONS ── */
@keyframes glowDice{0%,100%{box-shadow:0 0 0 transparent}50%{box-shadow:0 0 20px 7px #33333344}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes loopPulse{0%,100%{box-shadow:0 0 0 transparent}50%{box-shadow:0 0 16px 5px #f5a62388}}
.glow-dice{animation:glowDice 1.2s ease-in-out infinite;}
#board-wrap.capture-flash{animation:shake 0.35s ease;}

/* ── WIN SCREEN ── */
#win-screen{display:none;position:fixed;inset:0;background:#000000bb;z-index:200;align-items:center;justify-content:center;}
#win-screen.show{display:flex;}
#win-box{background:#fff;border-radius:20px;padding:36px 44px;text-align:center;max-width:300px;}
#win-box h2{font-size:26px;font-weight:900;margin-bottom:6px;}
#win-box p{color:#888;font-size:13px;margin-bottom:22px;font-weight:600;}
#win-box button{background:#1a1a1a;color:#fff;border:none;border-radius:12px;padding:12px 32px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:800;cursor:pointer;margin:4px;}
#win-box .back-btn{background:#f0f0f0;color:#333;}
</style>
</head>
<body>

<!-- ══ COVER PAGE ══ -->
<div id="cover-screen" onclick="hideCover()">
  <div id="cover-bg">
    <div class="cover-quad"></div>
    <div class="cover-quad"></div>
    <div class="cover-quad"></div>
    <div class="cover-quad"></div>
  </div>
  <div id="cover-diamond"></div>
  <canvas id="cover-canvas" style="position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;"></canvas>
  <div id="cover-title">
    <span class="ludo-word" id="ludo-letters"></span>
    <span class="new-word">N E W</span>
  </div>
  <div id="cover-tap">TAP TO PLAY</div>
</div>

<!-- ══ START SCREEN ══ -->
<div id="start-screen">
  <h1>Enhanced <span>Ludo</span></h1>

  <div class="start-card">
    <h3>NUMBER OF PLAYERS</h3>
    <div class="player-btns">
      <button class="player-btn" onclick="setPlayers(2)">2</button>
      <button class="player-btn" onclick="setPlayers(3)">3</button>
      <button class="player-btn active" onclick="setPlayers(4)">4</button>
    </div>
  </div>

  <div class="start-card">
    <h3>PLAYER NAMES</h3>
    <div id="name-inputs">
      <div class="color-row"><div class="color-dot" style="background:#e8222a"></div><input id="name-red" value="Red" maxlength="10"/></div>
      <div class="color-row"><div class="color-dot" style="background:#3a6fd8"></div><input id="name-blue" value="Blue" maxlength="10"/></div>
      <div class="color-row"><div class="color-dot" style="background:#3aaa35"></div><input id="name-green" value="Green" maxlength="10"/></div>
      <div class="color-row"><div class="color-dot" style="background:#f5a623"></div><input id="name-yellow" value="Yellow" maxlength="10"/></div>
    </div>
  </div>

  <div class="start-card">
    <h3>DICE SKIN</h3>
    <div class="dice-opts">
      <div class="dice-opt active" id="skin-white" onclick="setSkin('white')">
        <div class="dice-preview" style="background:#fff;border:2px solid #222;">
          <div class="dice-preview-grid" id="preview-white"></div>
        </div>
        <span>Classic</span>
      </div>
      <div class="dice-opt" id="skin-black" onclick="setSkin('black')">
        <div class="dice-preview" style="background:#1e1e1e;border:2px solid #444;">
          <div class="dice-preview-grid" id="preview-black"></div>
        </div>
        <span>Dark</span>
      </div>
    </div>
  </div>

  <button id="start-btn" onclick="startGame()">Start Game ▶</button>
</div>

<!-- ══ GAME SCREEN ══ -->
<div id="game-screen">
  <div id="topbar">
    <div id="turn-indicator">
      <div id="turn-dot"></div>
      <span id="turn-label">Red's turn</span>
    </div>
    <div id="menu-btn" onclick="toggleMenu()">⋯
      <div id="menu-dropdown">
        <div class="menu-item" onclick="toggleDiceSkin()">Toggle dice skin</div>
        <div class="menu-item" onclick="goHome()">Main menu</div>
        <div class="menu-item" onclick="restartGame()">Restart</div>
      </div>
    </div>
  </div>
  <div id="board-wrap"><canvas id="board-canvas"></canvas></div>
  <div id="bottomui">
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px;">
      <div id="dice" class="glow-dice" onclick="rollDice()"><div id="pip-container"></div></div>
      <div id="dice-label">TAP TO ROLL</div>
    </div>
    <div id="gamelog">Tap the dice to start!</div>
  </div>
</div>

<!-- ══ WIN SCREEN ══ -->
<div id="win-screen">
  <div id="win-box">
    <h2 id="win-title">Red Wins!</h2>
    <p id="win-sub">All tokens reached the center!</p>
    <button onclick="restartGame()">Play Again</button>
    <button class="back-btn" onclick="goHome()">Main Menu</button>
  </div>
</div>
